{% extends 'documents/base.html' %}

{% block title %}登録完了 - WEB請求書システム{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center py-5">
                <div class="mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle text-success" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                    </svg>
                </div>
                <h3 class="mb-3">登録依頼を受け付けました</h3>
                <p class="text-muted mb-4">
                    スタッフが内容を確認し、承認後にメールでお知らせいたします。<br>
                    承認までしばらくお待ちください。
                </p>
                <a href="{% url 'documents:login' %}" class="btn btn-primary">ログイン画面へ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
